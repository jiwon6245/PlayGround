<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>공업고 졸업전야 — 1인칭 공포 탐사 프로토타입</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="게임 뷰포트"></canvas>

  <!-- 모바일 가상 조이스틱 (데스크톱에서는 숨김) -->
  <div id="joystick" class="hidden">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>

  <div id="ui">
    <!-- 시작 화면 -->
    <div id="start-screen">
      <div class="card">
        <h1>공업고 졸업전야</h1>
        <p class="subtitle">1인칭 3D 공포 탐사 프로토타입</p>
        <p class="setting">배경: 한국 공업고등학교 &middot; 졸업식 전날 밤</p>
        <p class="hint">새로 전학 온 탐사자입니다. 교내를 자유롭게 탐색하고,<br>
        학생으로 위장해 위험을 피하며 숨겨진 진실을 밝혀내세요.</p>
        <button id="start-btn">탐사 시작</button>
      </div>
    </div>

    <!-- HUD (게임 중) -->
    <div id="hud" class="hidden">
      <div id="crosshair"></div>
      <div id="interact-prompt" class="hidden">E 키: 상호작용</div>
      <div id="flashlight">손전등: <span id="flashlight-state">ON</span> &nbsp;(F 키 전환)</div>
      <div id="suspicion">
        <div class="label">의심도</div>
        <div class="bar"><div id="suspicion-fill"></div></div>
      </div>
      <div id="help">WASD 이동 &middot; 마우스 시선 &middot; Shift 달리기 &middot; F 손전등 &middot; E 상호작용 &middot; Esc 잠금 해제</div>
    </div>

    <!-- 일시 메시지 -->
    <div id="msg" class="hidden"></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
